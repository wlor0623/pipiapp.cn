<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>皮皮软件 · 品牌图源文件</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'PingFang SC', 'MiSans', 'HarmonyOS Sans SC', 'Microsoft YaHei', system-ui, sans-serif;
    background: #888;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 40px;
    padding: 40px;
  }
  .label { color: #fff; font-size: 14px; }

  /* ============ OG 分享图 1200 × 630 ============ */
  #og {
    position: relative;
    width: 1200px;
    height: 630px;
    background: #faf6f1;
    overflow: hidden;
    display: flex;
    align-items: center;
  }
  #og::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(46% 52% at 84% 12%, rgba(255, 122, 31, 0.13), transparent 70%),
      radial-gradient(36% 42% at 8% 96%, rgba(255, 194, 75, 0.16), transparent 70%);
  }
  #og::after {
    content: '';
    position: absolute;
    inset: 0;
    background-image: radial-gradient(rgba(44, 37, 32, 0.055) 1.5px, transparent 1.5px);
    background-size: 26px 26px;
    mask-image: linear-gradient(115deg, transparent 52%, rgba(0,0,0,.9));
    -webkit-mask-image: linear-gradient(115deg, transparent 52%, rgba(0,0,0,.9));
  }
  .og-row {
    position: relative;
    display: flex;
    align-items: center;
    gap: 56px;
    padding-left: 96px;
  }
  .og-logo { filter: drop-shadow(0 18px 36px rgba(249, 93, 19, 0.28)); }
  .og-name {
    font-size: 108px;
    font-weight: 800;
    letter-spacing: 0.02em;
    color: #2c2520;
    line-height: 1.15;
  }
  .og-en {
    margin-top: 10px;
    font-size: 30px;
    font-weight: 700;
    letter-spacing: 0.14em;
    color: #f2600a;
  }
  .og-slogan {
    margin-top: 22px;
    font-size: 34px;
    color: #5e554d;
    letter-spacing: 0.06em;
  }
  .og-domain {
    position: absolute;
    right: 72px;
    bottom: 56px;
    font-size: 28px;
    font-weight: 600;
    color: #8b8177;
    letter-spacing: 0.05em;
  }
  .og-tiles { position: absolute; right: 88px; top: 84px; display: grid; grid-template-columns: repeat(2, 72px); gap: 20px; }
  .og-tile { width: 72px; height: 72px; border-radius: 20px; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 18px rgba(44,37,32,.08); }
  .og-tile svg { width: 36px; height: 36px; }

  /* ============ apple-touch-icon 180 × 180 ============ */
  #touch { width: 180px; height: 180px; }

  /* ============ favicon 32 × 32 ============ */
  #fav32 { width: 32px; height: 32px; }
</style>
</head>
<body>
  <div class="label">OG image 1200×630 ↓</div>
  <div id="og">
    <div class="og-row">
      <svg class="og-logo" width="230" height="230" viewBox="0 0 96 96" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="g-og" x1="0" y1="0" x2="96" y2="96" gradientUnits="userSpaceOnUse">
            <stop stop-color="#FC8527"/><stop offset="1" stop-color="#F95D13"/>
          </linearGradient>
        </defs>
        <rect width="96" height="96" rx="20" fill="url(#g-og)"/>
        <circle cx="48" cy="49.9" r="16.5" fill="#ffffff"/>
        <circle cx="48" cy="49.9" r="7.2" fill="url(#g-og)"/>
        <rect x="31.5" y="41" width="9" height="36.8" rx="4.5" fill="#ffffff"/>
        <circle cx="66.5" cy="25.3" r="4.8" fill="#ffffff"/>
      </svg>
      <div>
        <div class="og-name">皮皮软件</div>
        <div class="og-en">PIPI APP · 独立软件品牌</div>
        <div class="og-slogan">让软件更简单，让工具更好用。</div>
      </div>
    </div>
    <div class="og-tiles">
      <div class="og-tile" style="background:#ffe9d9">
        <svg viewBox="0 0 24 24" fill="none" stroke="#c24909" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6.25A2.25 2.25 0 0 1 6.25 4h11.5A2.25 2.25 0 0 1 20 6.25v11.5A2.25 2.25 0 0 1 17.75 20H6.25A2.25 2.25 0 0 1 4 17.75V6.25z"/><circle cx="8.6" cy="9" r="1.35"/><path d="M4.6 16.6l3.75-3.75a1.7 1.7 0 0 1 2.4 0l4.6 4.6M13.3 14.85l1.55-1.55a1.7 1.7 0 0 1 2.4 0l2.15 2.15"/></svg>
      </div>
      <div class="og-tile" style="background:#fff3dc">
        <svg viewBox="0 0 24 24" fill="none" stroke="#96660d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7.6 7.6h8.8v8.8H7.6z"/><path d="M10.6 10.6h2.8v2.8h-2.8z"/><path d="M9.4 3.9v3.7M14.6 3.9v3.7M9.4 16.4v3.7M14.6 16.4v3.7M3.9 9.4h3.7M3.9 14.6h3.7M16.4 9.4h3.7M16.4 14.6h3.7"/></svg>
      </div>
      <div class="og-tile" style="background:#e4f1e9">
        <svg viewBox="0 0 24 24" fill="none" stroke="#2f7d57" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4.9 17.8a8.2 8.2 0 1 1 14.2 0"/><path d="M12 13.4l3.6-3.6"/><path d="M13.2 13.2a1.2 1.2 0 1 1-2.4 0 1.2 1.2 0 0 1 2.4 0z"/></svg>
      </div>
      <div class="og-tile" style="background:#efeaf8">
        <svg viewBox="0 0 24 24" fill="none" stroke="#6b54a8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4.3c.85 3.7 2.3 5.15 6 6-3.7.85-5.15 2.3-6 6-.85-3.7-2.3-5.15-6-6 3.7-.85 5.15-2.3 6-6z"/><path d="M18.2 15.1c.4 1.75 1.1 2.45 2.85 2.85-1.75.4-2.45 1.1-2.85 2.85-.4-1.75-1.1-2.45-2.85-2.85 1.75-.4 2.45-1.1 2.85-2.85z"/></svg>
      </div>
    </div>
    <div class="og-domain">pipiapp.cn</div>
  </div>

  <div class="label">apple-touch-icon 180×180 ↓</div>
  <svg id="touch" viewBox="0 0 96 96" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="g-touch" x1="0" y1="0" x2="96" y2="96" gradientUnits="userSpaceOnUse">
        <stop stop-color="#FC8527"/><stop offset="1" stop-color="#F95D13"/>
      </linearGradient>
    </defs>
    <rect width="96" height="96" rx="20" fill="url(#g-touch)"/>
    <circle cx="48" cy="49.9" r="16.5" fill="#ffffff"/>
    <circle cx="48" cy="49.9" r="7.2" fill="url(#g-touch)"/>
    <rect x="31.5" y="41" width="9" height="36.8" rx="4.5" fill="#ffffff"/>
    <circle cx="66.5" cy="25.3" r="4.8" fill="#ffffff"/>
  </svg>

  <div class="label">favicon 32×32 ↓</div>
  <svg id="fav32" viewBox="0 0 96 96" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="g-fav" x1="0" y1="0" x2="96" y2="96" gradientUnits="userSpaceOnUse">
        <stop stop-color="#FC8527"/><stop offset="1" stop-color="#F95D13"/>
      </linearGradient>
    </defs>
    <rect width="96" height="96" rx="20" fill="url(#g-fav)"/>
    <circle cx="48" cy="49.9" r="16.5" fill="#ffffff"/>
    <circle cx="48" cy="49.9" r="7.2" fill="url(#g-fav)"/>
    <rect x="31.5" y="41" width="9" height="36.8" rx="4.5" fill="#ffffff"/>
    <circle cx="66.5" cy="25.3" r="4.8" fill="#ffffff"/>
  </svg>
</body>
</html>
